name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Package Release Assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkgDir = "KeyStar-$tag-windows-x64"
          New-Item -ItemType Directory -Path $pkgDir -Force

          # 実行バイナリと同梱ドキュメント・アイコンを配置
          Copy-Item "target\release\KeyStar.exe" -Destination "$pkgDir\"
          Copy-Item "README_JA.md" -Destination "$pkgDir\README.md"
          if (Test-Path "assets\icon.ico") {
            Copy-Item "assets\icon.ico" -Destination "$pkgDir\"
          }

          # ZIP アーカイブ作成
          $zipName = "KeyStar-$tag-windows-x64.zip"
          Compress-Archive -Path "$pkgDir\*" -DestinationPath $zipName -Force

          # SHA-256 チェックサム生成 (ZIP)
          $zipHash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding utf8

          # SHA-256 チェックサム生成 (単体 exe)
          $exeHash = (Get-FileHash -Path "target\release\KeyStar.exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  KeyStar.exe" | Out-File -FilePath "KeyStar.exe.sha256" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KeyStar-*-windows-x64.zip
            KeyStar-*-windows-x64.zip.sha256
            target/release/KeyStar.exe
            KeyStar.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
