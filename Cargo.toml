[package]
name = "KeyStar"
version = "0.1.0-beta.3"
edition = "2024"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
eframe = "0.37.0"
evalexpr = "13.1.0"
global-hotkey = "0.9.0"
open = "5.4.4"
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
